<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wolsales-billing</title>
    <script>
      // Redirect to built version if not running in Vite dev server (e.g. opened via Live Server on port 5500)
      (function() {
        const isStaticPort = window.location.port === '5500' || window.location.port === '5501';
        if (isStaticPort && !window.location.pathname.includes('/dist')) {
          window.location.href = './dist/index.html';
          return;
        }

        setTimeout(function() {
          const isDevHtml = !!document.querySelector('script[src*="main.tsx"]');
          if (isDevHtml) {
            const isViteActive = !!document.querySelector('script[src*="@vite"]') || 
                                 window.__vite_plugin_react_preamble_installed__ ||
                                 typeof window.__vite_plugin_react_preamble_installed__ !== 'undefined';
            if (!isViteActive) {
              console.log("Static server detected, redirecting to built app...");
              window.location.href = './dist/index.html';
            }
          }
        }, 50);
      })();
    </script>
    <script>
      // Register Service Worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
              console.log('PWA Service Worker registered with scope: ', reg.scope);
            })
            .catch(function(err) {
              console.error('PWA Service Worker registration failed: ', err);
            });
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-EzXTrUXK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-RBOPjv3w.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
